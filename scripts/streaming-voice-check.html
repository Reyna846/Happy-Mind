<!doctype html><html lang="en"><meta charset="utf-8"><title>Streaming voice verification</title><style>body{max-width:740px;margin:40px auto;background:#eee4f6;color:#382447;font:18px system-ui}button{padding:16px;margin:8px;border-radius:16px}pre{white-space:pre-wrap}</style><h1>Streaming voice verification</h1><p>Tests real Heart phrase playback while a simulated token stream continues. Uses only fixed test text.</p><button id="prepare">Prepare Heart test voice</button><button id="run" disabled>Play streaming test</button><button id="stop">Stop</button><pre id="status">Not prepared</pre><pre id="events"></pre><script type="module">
import {StreamingSpeech} from '/src/streaming-speech.ts';
import {prepareHeart,synthesizeHeart,playHeartAudio,unlockHeart,stopHeart} from '/src/local-voice.ts';
const status=document.querySelector('#status'),events=document.querySelector('#events'),prepare=document.querySelector('#prepare'),run=document.querySelector('#run');let queue,timer,epoch=0;
prepare.onclick=async()=>{prepare.disabled=true;status.textContent='Preparing actual Heart model';try{await prepareHeart();status.textContent='Heart ready';run.disabled=false;}catch(e){status.textContent='FAIL: '+e.message;}finally{prepare.disabled=false;}};
const stop=()=>{epoch++;clearInterval(timer);queue?.cancel();stopHeart();run.disabled=false;status.textContent='Stopped';};document.querySelector('#stop').onclick=stop;
run.onclick=()=>{stop();run.disabled=true;events.textContent='';status.textContent='Streaming text and speech';unlockHeart();const token=++epoch,start=performance.now();let generated=false,early=false;const log=text=>events.textContent+=`${((performance.now()-start)/1000).toFixed(1)}s ${text}\n`;
queue=new StreamingSpeech({prepare:synthesizeHeart,play:(text,audio)=>new Promise((resolve,reject)=>{void playHeartAudio(audio,.25,()=>token===epoch,()=>{if(!generated)early=true;log('Audio started: '+text);},()=>{log('Phrase ended');resolve();}).catch(reject);}),onDrain:()=>{status.textContent=early?'PASS: actual Heart audio began before text generation finished; phrases played in order.':'FAIL: audio did not start until generation completed';run.disabled=false;},onError:error=>{status.textContent='FAIL: '+error.message;run.disabled=false;}});
const words='There is no hurry. Let your shoulders soften, and take this moment at your own pace. You can begin again whenever you are ready.'.split(' ');let index=0;timer=setInterval(()=>{if(index<words.length){const text=words[index++]+' ';queue.push(text);log('Text: '+text);}else{clearInterval(timer);generated=true;log('Generation finished');queue.finish();}},400);
};
</script></html>
