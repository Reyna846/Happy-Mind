<!doctype html><html lang="en"><meta charset="utf-8"><title>Local speech pipeline verification</title><style>body{max-width:720px;margin:40px auto;background:#eee4f6;color:#382447;font:18px system-ui}button{padding:16px;border-radius:16px}pre{white-space:pre-wrap}</style><h1>Local speech pipeline verification</h1><p>Uses the app’s bundled “arrive” spoken guide as a known audio fixture. Tests actual Whisper transcription, then actual Llama generation. No microphone or personal audio.</p><button id="run">Run local speech test</button><pre id="status">Not started</pre><pre id="words"></pre><pre id="reply"></pre><script type="module">
import {prepareOfflineMic,transcribeOffline,micStatus} from '/src/offline-mic.ts';
import {loadLocalAI} from '/src/local-ai.ts';
const status=document.querySelector('#status'),words=document.querySelector('#words'),reply=document.querySelector('#reply'),button=document.querySelector('#run');
button.onclick=async()=>{button.disabled=true;let ctx,worker;const timer=setInterval(()=>{status.textContent=micStatus().message||status.textContent;},1000);try{status.textContent='Preparing Whisper';await prepareOfflineMic();clearInterval(timer);if(micStatus().state!=='ready')throw Error(micStatus().message);status.textContent='Decoding known speech';ctx=new AudioContext();const audio=await ctx.decodeAudioData(await(await fetch('/audio/guides/arrive.wav')).arrayBuffer());const offline=new OfflineAudioContext(1,Math.ceil(audio.duration*16000),16000);const input=offline.createBufferSource();input.buffer=audio;input.connect(offline.destination);input.start();const rendered=await offline.startRendering();status.textContent='Transcribing with real Whisper model';const text=await transcribeOffline(new Float32Array(rendered.getChannelData(0)));if(!text.trim())throw Error('No words');words.textContent='Recognised: '+text;status.textContent='Loading Llama';worker=new Worker(new URL('/src/ai-worker.ts',import.meta.url),{type:'module'});const engine=await loadLocalAI(worker,p=>status.textContent=p);status.textContent='Sending recognised text to Llama';const result=await engine.chat.completions.create({messages:[{role:'system',content:'Reply briefly in English to the user.'},{role:'user',content:text}],max_tokens:60});const response=result.choices[0]?.message?.content;if(!response)throw Error('No model response');reply.textContent='Llama: '+response;status.textContent='PASS: audio → real local transcription → real local model reply';}catch(error){status.textContent='FAIL: '+error.message;}finally{clearInterval(timer);button.disabled=false;worker?.terminate();await ctx?.close();}};
</script></html>
